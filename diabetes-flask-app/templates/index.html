<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Diabetes Predictor</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <div class="top-nav">
    <a href="/">🔮 Predict</a> |
    <a href="/visualizations">📈 Visualizations</a> |
    <a href="/research">🔬 Research & Observations</a>
  </div>
  <div class="container">
    <h1>🩺 Diabetes Prediction</h1>
    <form id="predict-form">
      <div class="grid">
        {% for f in fields %}
        <div class="form-group">
          <label>{{ f.label }}</label>
          {% if f.type=='radio' %}
          <div class="radio-group">
            {% for opt in f.options %}
            <input type="radio"
                   id="{{f.name}}_{{opt.value}}"
                   name="{{f.name}}"
                   value="{{opt.value}}"
                   {% if loop.first %}checked{% endif %}>
            <label for="{{f.name}}_{{opt.value}}">{{opt.label}}</label>
            {% endfor %}
          </div>
          {% elif f.type=='select' %}
          <select name="{{f.name}}">
            {% for opt in f.options %}
            <option value="{{opt.value}}">{{opt.label}}</option>
            {% endfor %}
          </select>
          {% elif f.type=='range' %}
          <input type="range" name="{{f.name}}"
                 min="{{f.min}}" max="{{f.max}}"
                 value="{{f.default}}"
                 oninput="this.nextElementSibling.value=this.value">
          <output>{{f.default}}</output>
          {% else %}
          <input type="number" name="{{f.name}}"
                 step="{{f.step}}" value="{{f.default}}" required>
          {% endif %}
        </div>
        {% endfor %}
      </div>
      <button type="submit" class="predict-button">Submit</button>
    </form>
    <div id="prediction-output" class="prediction-output" style="display:none;"></div>
  </div>
  <script>
    document.getElementById("predict-form").addEventListener("submit",async e=>{
      e.preventDefault();
      const res=await fetch("/api/predict",{method:"POST",body:new FormData(e.target)});
      const {prediction_text}=await res.json();
      const out=document.getElementById("prediction-output");
      out.textContent=prediction_text; out.style.display="block";
    });
  </script>
</body>
</html>
